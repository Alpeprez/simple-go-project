name: 03b - build node application
on:
  push:
    branches:
      - main
jobs:
  Build-node-application:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
    - name: Install dependencies
      run: npm ci
    - name: test
      run: npm test
        

